# pnpm workspace definition for the monorepo.
# Module frontends (modules/*/frontend) will be added when the first module lands (Fase 4).
packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
  - "modules/*/frontend"

# Single source of truth for versions shared across packages: a package writes
# "typescript": "catalog:" instead of a range, so two packages can never drift
# onto different majors of the same tool — the failure mode that makes monorepo
# type errors depend on which folder you are in.
catalog:
  "@tailwindcss/vite": ^4.3.3
  "@vitejs/plugin-vue": ^6.0.8
  "@vue/test-utils": ^2.4.11
  jsdom: ^30.0.1
  tailwindcss: ^4.3.3
  typescript: ^5.9.3
  vite: ^8.2.2
  vitest: ^4.1.11
  vue: ^3.5.41
  vue-tsc: ^3.3.11
  zod: ^4.4.3
