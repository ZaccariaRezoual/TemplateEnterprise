# Local development infrastructure for the framework.
#
# Services:
# - postgres: primary relational database (EF Core)
# - redis:    distributed cache + SignalR backplane (Fase 6+)
# - seq:      structured log sink for Serilog (UI at http://localhost:5341)
#
# Configuration comes from ./.env (see .env.example); every variable has a
# safe local default so `docker compose up` works out of the box.
# These credentials are for LOCAL DEVELOPMENT ONLY.

name: enterprise-framework

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-enterprise}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Recent Seq images refuse to start without a first-run admin password
      # (or explicit no-auth opt-in). Local default, override via .env.
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-dev_password}
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  redis-data:
  seq-data:
